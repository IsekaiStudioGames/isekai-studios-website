<!DOCTYPE html>
<html lang="en">

<!-- Meta Data -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Isekai Studios - Indie Game Development Studio | Portal to Another World</title>
    <meta name="title" content="Isekai Studios - Indie Game Development Studio | Portal to Another World">
    <meta name="description" content="Isekai Studios creates immersive indie games that transport players to extraordinary worlds. Discover our debut game 'May All Your Bacon Burn' and join our adventure through magical realms.">
    <meta name="keywords" content="isekai studios, indie game studio, game development, may all your bacon burn, indie games, isekai games, adventure games, magical games, game developers">
    <meta name="author" content="Isekai Studios">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://isekaistudiosgames.com/">
    <meta property="og:title" content="Isekai Studios - Journey to Another World">
    <meta property="og:description" content="Indie game studio creating portals to extraordinary worlds. Explore our magical adventure games and join the hero's journey.">
    <meta property="og:image" content="https://isekaistudiosgames.com/Images/MAYBB.png">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://isekaistudiosgames.com/">
    <meta property="twitter:title" content="Isekai Studios - Journey to Another World">
    <meta property="twitter:description" content="Indie game studio creating portals to extraordinary worlds. Explore our magical adventure games and join the hero's journey.">
    <meta property="twitter:image" content="https://isekaistudiosgames.com/Images/MAYBB.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Images/MAYBB.png">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://isekaistudiosgames.com/">

   
    <!-- Style Sheet -->
    <link rel="stylesheet" href="Style.css">
    
    <!-- modals-->
    <script src="modals.js"></script>  
</head>

 
<body>
    <div class="stars-bg" id="stars"></div>

    <div class="logo-center">
        <h1>⚔️ ISEKAI STUDIOS 🔮</h1>
        <p>『 Follow the Hero's Journey 』</p>
    </div>

    <div class="journey-container">
        <div class="traveler"></div>
        
        <div class="journey-path">
            <!-- Station 1: Lore -->
            <div class="portal-station">
                <a href="#" class="portal portal-lore" onclick="openModal('lore'); return false;">
                    <div class="portal-inner">
                        <div class="portal-icon"><img src="Images/OldBook_2.png" alt="Lore Book"></div>
                        <div class="portal-label">Lore</div>
                    </div>
                </a>
                <div class="station-number">1</div>
            </div>

            <!-- Station 2: Team -->
            <div class="portal-station">
                <a href="#" class="portal portal-team" onclick="openModal('team'); return false;">
                    <div class="portal-inner">
                        <div class="portal-icon">⚔️</div>
                        <div class="portal-label">The Heroes</div>
                    </div>
                </a>
                <div class="station-number">2</div>
            </div>

            <!-- Station 3: Contact -->
            <div class="portal-station">
                <a href="#" class="portal portal-contact" onclick="openModal('contact'); return false;">
                    <div class="portal-inner">
                        <div class="portal-icon">💌</div>
                        <div class="portal-label">Messenger</div>
                    </div>
                </a>
                <div class="station-number">3</div>
            </div>

            <!-- Station 4: Guild Hall -->
            <div class="portal-station">
                <a href="#" class="portal portal-home" onclick="openModal('home'); return false;">
                    <div class="portal-inner">
                        <div class="portal-icon">🏰</div>
                        <div class="portal-label">Guild Hall</div>
                    </div>
                </a>
                <div class="station-number">4</div>
            </div>

            <!-- Station 5: Quest Board -->
            <div class="portal-station">
                <a href="#" class="portal portal-games" onclick="openModal('games'); return false;">
                    <div class="portal-inner">
                        <div class="portal-icon">🎮</div>
                        <div class="portal-label">Quest Board</div>
                    </div>
                </a>
                <div class="station-number">5</div>
            </div>

            <!-- Station 6: Chronicles -->
            <div class="portal-station">
                <a href="#" class="portal portal-news" onclick="openModal('news'); return false;">
                    <div class="portal-inner">
                        <div class="portal-icon">📰</div>
                        <div class="portal-label">Chronicles</div>
                    </div>
                </a>
                <div class="station-number">6</div>
            </div>


            <!-- Station 7: Webgame -->
            <div class="portal-station">
                <a href="#" class="portal portal-news" onclick="openModal('news'); return false;">
                    <div class="portal-inner">
                        <div class="portal-icon">📰</div>
                        <div class="portal-label">Webgame</div>
                    </div>
                </a>
                <div class="station-number">6</div>
            </div>
        </div>
    </div>

    <div class="info-panel">
        <h3>🎮 Hero's Journey</h3>
        <p>🚶 Follow the traveler along the path</p>
        <p>📍 Each station reveals a new chapter</p>
        <p>✨ Click any portal to explore</p>
    </div>

    

    <!--running scripts-->
   
    <script src="script.js"></script>

</body>
</html>
